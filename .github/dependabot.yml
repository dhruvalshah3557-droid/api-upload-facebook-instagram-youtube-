{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "pip",
      "directory": "/auto_upload",
      "schedule": {
        "interval": "daily",
        "time": "09:00",
        "timezone": "Asia/Kolkata"
      },
      "open-pull-requests-limit": 3,
      "groups": {
        "compatible-updates": {
          "patterns": [
            "*"
          ],
          "update-types": [
            "patch",
            "minor"
          ]
        }
      },
      "commit-message": {
        "prefix": "chore",
        "include": "scope"
      },
      "labels": [
        "dependencies",
        "auto-merge"
      ],
      "rebase-strategy": "auto"
    },
    {
      "package-ecosystem": "github-actions",
      "directory": "/",
      "schedule": {
        "interval": "daily",
        "time": "09:00",
        "timezone": "Asia/Kolkata"
      },
      "open-pull-requests-limit": 3,
      "groups": {
        "compatible-updates": {
          "patterns": [
            "*"
          ],
          "update-types": [
            "patch",
            "minor"
          ]
        }
      },
      "commit-message": {
        "prefix": "chore",
        "include": "scope"
      },
      "labels": [
        "dependencies",
        "auto-merge"
      ],
      "rebase-strategy": "auto"
    }
  ]
}
