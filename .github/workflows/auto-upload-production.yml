name: Auto Upload Production

on:
  schedule:
    # Stagger away from minute 0/10 to reduce GitHub Actions schedule delays.
    # Still runs every 10 minutes.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/production-trigger.txt

concurrency:
  group: auto-upload-production
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto_upload
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python with pip cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: auto_upload/requirements.txt

      - name: Cache YouTube OAuth token
        uses: actions/cache@v5
        with:
          path: auto_upload/credentials/youtube_token.pickle
          key: youtube-token-${{ runner.os }}

      - name: Install ffmpeg only if missing
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account credentials
        env:
          GOOGLE_SHEET_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEET_CREDENTIALS_JSON }}
        run: echo "$GOOGLE_SHEET_CREDENTIALS_JSON" > credentials/service_account.json

      - name: Write YouTube client secret
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBEJSON || secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: echo "$YOUTUBE_CLIENT_SECRET_JSON" > credentials/youtube_client_secret.json

      - name: Preflight Meta token and discover new pages
        env:
          GOOGLE_SHEET_CREDENTIALS: credentials/service_account.json
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          SOURCE_IMPORT_SHEET: Source Import
          ACCOUNTS_SHEET: Accounts
          QUEUE_SHEET: Publishing Queue
          LOG_SHEET: Publishing Log
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOKTOKEN }}
        run: python meta_account_sync.py

      - name: Reset Google Sheets quota window
        run: sleep 65

      - name: Run optimized auto upload
        id: upload
        env:
          GOOGLE_SHEET_CREDENTIALS: credentials/service_account.json
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          SOURCE_IMPORT_SHEET: Source Import
          ACCOUNTS_SHEET: Accounts
          QUEUE_SHEET: Publishing Queue
          LOG_SHEET: Publishing Log
          MAX_JOBS_PER_RUN: "20"
          MAX_GENERATE_JOBS: "20"
          AUTO_ADD_AUDIO: "true"
          TRENDING_AUDIO_URL: ${{ secrets.TRENDING_AUDIO_URL }}
          # Optional comma-separated licensed library. When unset, the six
          # bundled CC0 tracks rotate automatically. The former single-track
          # BACKGROUND_MUSIC_URL is intentionally retired.
          BACKGROUND_MUSIC_URLS: ${{ secrets.BACKGROUND_MUSIC_URLS }}
          IG_AUTO_TRENDING_AUDIO: "true"
          IG_AUDIO_SEARCH_QUERY: ${{ vars.IG_AUDIO_SEARCH_QUERY }}
          IG_AUDIO_SEARCH_QUERIES: ${{ vars.IG_AUDIO_SEARCH_QUERIES }}
          IG_AUDIO_VOLUME: "80"
          IG_VIDEO_VOLUME: "60"
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOKTOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_JIYA: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_JIYA }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          python optimized_runner.py

          if grep -Eqi "Sheets connection failed|Google Sheets connection failed" /tmp/auto_upload.log; then
            echo "ERROR: Auto upload could not connect to Google Sheets."
            exit 1
          fi

          # Do not report a green workflow when publishing was actually attempted
          # but every selected job failed. This makes upload outages visible.
          if grep -Eq "Processing [1-9][0-9]* pending job\(s\)" /tmp/auto_upload.log; then
            if ! grep -Eq "uploaded ->" /tmp/auto_upload.log; then
              echo "ERROR: Upload jobs were processed, but none published successfully."
              exit 1
            fi
          fi

      - name: Write production health summary
        if: always()
        env:
          UPLOAD_STEP_CONCLUSION: ${{ steps.upload.outcome }}
        run: python workflow_health.py

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: auto-upload-production-log
          path: /tmp/auto_upload.log
          if-no-files-found: ignore
