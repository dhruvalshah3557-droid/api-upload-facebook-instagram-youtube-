name: Pipeline Safety Tests

on:
  push:
    branches: [master]
    paths:
      - "auto_upload/**"
      - ".github/workflows/auto-upload-production.yml"
      - ".github/workflows/watchdog.yml"
      - ".github/workflows/pipeline-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-safety-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: auto_upload/requirements.txt
      - run: pip install -r auto_upload/requirements.txt
      - name: Compile Python
        run: python -m compileall -q auto_upload
      - name: Run pipeline safety tests
        working-directory: auto_upload
        run: python test_pipeline.py
