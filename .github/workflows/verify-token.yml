name: Verify FB Token

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Verify FB token against Graph API
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOKTOKEN || secrets.FACEBOOKDEBUGTOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$FB_ACCESS_TOKEN" ]; then
            echo "ERROR: FB_ACCESS_TOKEN is empty (neither FACEBOOKTOKEN nor FACEBOOKDEBUGTOKEN is set)."
            exit 1
          fi

          RESPONSE=$(curl -sS --max-time 60 \
            "https://graph.facebook.com/v19.0/debug_token?input_token=$FB_ACCESS_TOKEN&access_token=$FB_ACCESS_TOKEN")

          python3 -c '
          import json, sys, time

          try:
              payload = json.loads(sys.argv[1])
          except json.JSONDecodeError:
              print("ERROR: Graph API returned invalid JSON:")
              print(sys.argv[1][:2000])
              sys.exit(1)

          def fail(msg):
              print("ERROR: " + msg)
              sys.exit(1)

          err = payload.get("error")
          if err:
              fail("Graph API error: %s (%s): %s" % (err.get("type"), err.get("code"), err.get("message")))

          data = payload.get("data") or {}
          if data.get("is_valid") is False or (err or {}).get("is_valid") is False:
              fail("token is invalid (is_valid=false): " + str((err or {}).get("message", "no message")))

          expires_at = data.get("expires_at", 0)
          if expires_at and expires_at <= int(time.time()):
              fail("token has expired (expires_at=%s)" % time.strftime("%Y-%m-%d %H:%M:%S UTC", time.gmtime(expires_at)))

          if expires_at:
              expires_str = time.strftime("%Y-%m-%d %H:%M:%S UTC", time.gmtime(expires_at))
          else:
              expires_str = "never"

          print("TOKEN OK")
          print("token id:  " + str(data.get("profile_id") or data.get("user_id") or "unknown"))
          print("app id:    " + str(data.get("app_id") or "unknown"))
          print("expires_at: " + expires_str)
          ' "$RESPONSE"
