name: Meta Analytics Collection

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - auto_upload/meta_analytics.py
      - .github/workflows/meta-analytics.yml

concurrency:
  group: meta-analytics-collection
  cancel-in-progress: false

jobs:
  collect:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto_upload
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: auto_upload/requirements.txt
      - run: pip install -r requirements.txt
      - name: Write Google credentials
        env:
          GOOGLE_SHEET_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEET_CREDENTIALS_JSON }}
        run: echo "$GOOGLE_SHEET_CREDENTIALS_JSON" > credentials/service_account.json
      - name: Collect Facebook and Instagram analytics
        env:
          GOOGLE_SHEET_CREDENTIALS: credentials/service_account.json
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          ACCOUNTS_SHEET: Accounts
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOKTOKEN }}
          FACEBOOKTOKEN: ${{ secrets.FACEBOOKTOKEN }}
        run: python meta_analytics.py
