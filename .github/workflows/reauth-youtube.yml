name: Reauthorize YouTube Channel

# Exchanges a fresh Google OAuth authorization code for a new refresh token
# using the existing client secrets. Outputs are written to files and uploaded
# as a workflow artifact because GitHub masks secret substrings in logs, which
# would corrupt the consent URL and the printed token.
#
# Usage:
#   1. Run with mode=url and channel=<NAME>; download the `reauth-output`
#      artifact and open consent.txt.
#   2. Approve in the browser and copy the full 127.0.0.1:8080 redirect URL.
#   3. Run again with mode=exchange, same channel, and paste that URL.
#   4. Download the artifact and copy the YOUTUBE_OAUTH_REFRESH_TOKEN_* value
#      from secret.txt into GitHub Secrets.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to authorize"
        required: true
        type: choice
        options:
          - COLOURDIAMONDSS
          - JIYA
          - TRENDINGJEWELS
          - TREND
          - ISRAEL
      mode:
        description: "url = print consent link, exchange = trade code for token"
        required: true
        type: choice
        options:
          - url
          - exchange
      code:
        description: "Authorization code or full redirect URL (exchange mode only)"
        required: false

permissions:
  contents: read

jobs:
  reauth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-auth-oauthlib google-api-python-client

      - name: Print consent URL
        if: inputs.mode == 'url'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID_COLOURDIAMONDSS: ${{ secrets.YOUTUBE_CLIENT_ID_COLOURDIAMONDSS }}
          YOUTUBE_CLIENT_SECRET_COLOURDIAMONDSS: ${{ secrets.YOUTUBE_CLIENT_SECRET_COLOURDIAMONDSS }}
        working-directory: auto_upload
        run: |
          python youtube_reauth.py --channel "${{ inputs.channel }}" --mode url > /tmp/reauth_url.txt
          echo "Consent URL written to artifact (log masking would corrupt it)."

      - name: Exchange code for refresh token
        if: inputs.mode == 'exchange'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID_COLOURDIAMONDSS: ${{ secrets.YOUTUBE_CLIENT_ID_COLOURDIAMONDSS }}
          YOUTUBE_CLIENT_SECRET_COLOURDIAMONDSS: ${{ secrets.YOUTUBE_CLIENT_SECRET_COLOURDIAMONDSS }}
          AUTH_CODE: ${{ inputs.code }}
        working-directory: auto_upload
        run: |
          python youtube_reauth.py --channel "${{ inputs.channel }}" --mode exchange --code "$AUTH_CODE" > /tmp/reauth_out.txt
          echo "Refresh token written to artifact (log masking would corrupt it)."

      - name: Upload reauth output
        uses: actions/upload-artifact@v7
        with:
          name: reauth-output
          path: |
            /tmp/reauth_url.txt
            /tmp/reauth_out.txt
          if-no-files-found: ignore
          retention-days: 1
